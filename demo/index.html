<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DwellDeck · Demo</title>
<style>body{margin:0;background:#08121e;color:#edf5ff;font-family:system-ui;padding:24px}main{max-width:1250px;margin:auto}aside{padding:12px 0;color:#a9c3d6}button{cursor:pointer}</style>
<main><aside>DwellDeck · Demonstration data · No connected devices</aside><dwelldeck-card></dwelldeck-card></main>
<script type="module">
import '../dwelldeck.js';
class MockTile extends HTMLElement {
  setConfig(config){this.config=config;this.attachShadow({mode:'open'});}
  set hass(hass){this.shadowRoot.replaceChildren();const box=document.createElement('div');box.style.cssText='padding:22px;border-radius:14px;border:1px solid #385166;background:#192f43;color:#edf5ff;min-height:80px';const state=hass.states[this.config.entity];box.textContent=`${state?.attributes.friendly_name || this.config.entity} · ${state?.state || 'unavailable'}`;this.shadowRoot.append(box);}
}
customElements.define('mock-native-tile',MockTile);
window.loadCardHelpers=async()=>({createCardElement(config){const tile=document.createElement('mock-native-tile');tile.setConfig(config);return tile;}});
const areas=[{area_id:'living',name:'Living room'},{area_id:'kitchen',name:'Kitchen'},{area_id:'garden',name:'Garden'},{area_id:'bedroom',name:'Bedroom'}];
const names={ 'light.living_ceiling':'Ceiling lights','light.living_lamp':'Reading lamp','media_player.living':'Living room speakers','light.kitchen':'Kitchen lights','switch.coffee':'Coffee corner','light.garden_path':'Path lights','light.garden_wall':'Wall lights','switch.garden_fountain':'Garden fountain','light.bedroom':'Bedroom lights','cover.bedroom':'Bedroom curtains','climate.bedroom':'Bedroom AC'};
const entities=Object.keys(names).map(entity_id=>({entity_id,area_id:entity_id.includes('living')?'living':entity_id.includes('kitchen')||entity_id.includes('coffee')?'kitchen':entity_id.includes('garden')?'garden':'bedroom'}));
const states=Object.fromEntries(Object.entries(names).map(([id,name])=>[id,{entity_id:id,state:id.includes('ceiling')||id==='light.kitchen'?'on':id.startsWith('cover.')?'closed':id.startsWith('media_player.')?'idle':'off',attributes:{friendly_name:name}}]));
const card=document.querySelector('dwelldeck-card');card.setConfig({type:'custom:dwelldeck-card',title:'DwellDeck',auto_areas:true});card.hass={states,callWS:async({type})=>type.includes('/area_')?areas:type.includes('/entity_')?entities:[]};
</script></html>
